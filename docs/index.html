<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="./manifest.json" />
    <title>vrmc</title>
    <link rel="icon" href="./assets/icons/icon_16.png" />
    <style>
      body {
        margin: 0;
        background-color: black;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      video {
        display: none;
      }
    </style>
  </head>
  <body>
    <nav id="fullbody-link" style="position:fixed;top:12px;left:12px;z-index:10;padding:10px 14px;border-radius:8px;background:#162920e6;font:14px sans-serif">
      <a href="./fullbody/" style="color:#bbf2d8;text-decoration:none">全身トラッキング版を開く ↗</a>
      <button type="button" aria-label="案内を閉じる" onclick="document.getElementById('fullbody-link').remove()" style="margin-left:10px;border:0;background:none;color:#bbf2d8;cursor:pointer">×</button>
    </nav>
    <script>setTimeout(() => document.getElementById('fullbody-link')?.remove(), 10000);</script>
    <script src="./diagnostics.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./service-worker.js");
      }
    </script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/",
          "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js",
          "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/vision_bundle.mjs"
        }
      }
    </script>
    <script type="module">
      import * as vision from "@mediapipe/tasks-vision";
      import { initScene, resize, setBackgroundColor } from "./scene.js";
      import { VRMAvatar } from "./vrmAvatar.js";
      import indexedDB from "./indexedDB.js";

      const STORE_KEYS = {
        BACK_GROUND_COLOR: "backGroundColor",
        CURRENT_VRM: "currentVrm",
      };

      const diagnostics = window.vrmDiagnostics;
      diagnostics.stage("シーン初期化");
      const { scene, timer, camera, renderer } = initScene();
      diagnostics.renderer(renderer);

      window.addEventListener("resize", () => resize());

      const video = document.getElementById("video");
      diagnostics.camera(video);

      const initCamera = async () => {
        diagnostics.stage("カメラ許可待ち");
        video.srcObject = await navigator.mediaDevices.getUserMedia({
          video: true,
        });
        // Explicit playback also starts hidden camera video on iOS.
        diagnostics.stage("動画の再生開始待ち");
        await video.play();
        diagnostics.stage("動画再生開始済み");
        return video;
      };

      let avatar;
      const load = (url) => {
        avatar = new VRMAvatar(url, scene);
      };

      const changeAvatar = (url) => {
        if (!avatar) {
          // If no avatar instance exists yet, load the given model instead
          load(url);
          return;
        }
        avatar.changeModel(url);
      };

      const startFaceTracking = async (video) => {
        const { FaceLandmarker, FilesetResolver } = vision;

        diagnostics.stage("MediaPipe WASM準備中");
        const filesetResolver = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.0.1/wasm",
        );
        diagnostics.stage("顔検出モデル初期化中（GPU）");
        const faceLandmarker = await FaceLandmarker.createFromOptions(
          filesetResolver,
          {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task",
              delegate: "GPU",
            },
            outputFaceBlendshapes: true,
            outputFacialTransformationMatrixes: true,
            numFaces: 1,
            runningMode: "VIDEO",
          },
        );

        diagnostics.stage("顔検出モデル準備完了");
        const detect = async () => {
          diagnostics.detectionStart();
          const result = await faceLandmarker.detectForVideo(
            video,
            performance.now(),
          );
          diagnostics.detectionEnd(result);
          if (result.faceLandmarks?.length > 0 && avatar) {
            const blendshapeData = avatar.calculateBlendshapes(result);
            if (blendshapeData) {
              avatar.applyBlendshapes(blendshapeData);
            }
          }
          diagnostics.detectionApplied();
          requestAnimationFrame(detect);
        };
        detect();
      };

      const animate = () => {
        requestAnimationFrame(animate);
        timer.update();
        // Only update the avatar when it's ready to avoid throwing errors
        if (avatar?.vrm) {
          try {
            avatar.vrm.update(timer.getDelta());
          } catch (e) {
            console.warn("avatar.vrm.update failed:", e);
          }
        }
        renderer.render(scene, camera);
        diagnostics.frame();
      };

      const backgroundColors = [
        0x00ff00, 0x00ffff, 0x0000ff, 0xff00ff, 0xff0000, 0xffff00,
      ];
      let backgroundColorIndex = 0;

      // Ctrl+左右矢印で背景色変更
      window.addEventListener("keydown", async (event) => {
        // Windows/Linux: Ctrlキー, Mac: Metaキー(Commandキー) どちらかが押されていればOK
        if (!(event.ctrlKey || event.metaKey)) return;

        if (event.key === "ArrowRight") {
          backgroundColorIndex =
            (backgroundColorIndex + 1) % backgroundColors.length;
        } else if (event.key === "ArrowLeft") {
          backgroundColorIndex =
            (backgroundColorIndex - 1 + backgroundColors.length) %
            backgroundColors.length;
        } else {
          return;
        }

        setBackgroundColor(backgroundColors[backgroundColorIndex]);

        await indexedDB.saveData(
          STORE_KEYS.BACK_GROUND_COLOR,
          backgroundColors[backgroundColorIndex],
        );
      });

      // dnd handler
      window.addEventListener("dragover", (event) => {
        event.preventDefault();
      });

      window.addEventListener("drop", (event) => {
        event.preventDefault();

        // read given file then convert it to blob url
        const files = event.dataTransfer.files;
        if (!files) {
          return;
        }

        const file = files[0];
        if (!file) {
          return;
        }

        const blob = new Blob([file], { type: "application/octet-stream" });
        const url = URL.createObjectURL(blob);
        changeAvatar(url);
        indexedDB.saveFile(STORE_KEYS.CURRENT_VRM, file);
      });

      const start = async () => {
        indexedDB
          .loadData(STORE_KEYS.BACK_GROUND_COLOR)
          .then((backGroundColor) => {
            setBackgroundColor(backGroundColor);
            // 配列内のindexをセット
            const index = backgroundColors.findIndex(
              (c) => c === backGroundColor,
            );
            if (index !== -1) {
              backgroundColorIndex = index;
            }
          })
          .catch(() => {
            setBackgroundColor(0x00ff00);
            backgroundColorIndex = 0;
          });

        indexedDB
          .loadData(STORE_KEYS.CURRENT_VRM)
          .then((file) => {
            const blob = new Blob([file], { type: "application/octet-stream" });
            const url = URL.createObjectURL(blob);
            load(url);
          })
          .catch((e) => {
            load("./models/VRM1_Constraint_Twist_Sample.vrm");
          });

        initCamera().then((v) => startFaceTracking(v));
        animate();
      };

      await start();
    </script>

    <video autoplay muted playsinline id="video"><track kind="captions" /></video>
  </body>
</html>
