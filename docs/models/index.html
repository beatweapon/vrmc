<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サンプルVRM — VRMC</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#141b20;color:#e6efec}body{max-width:1100px;margin:auto;padding:40px 24px}a{color:#b3efd9}h1{font-size:30px}p{line-height:1.8;color:#b6c5c0}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;margin:32px 0}article{background:#202b32;border:1px solid #39484e;border-radius:12px;padding:20px}img{width:100%;height:230px;object-fit:contain;background:#172127;border-radius:8px}h2{font-size:19px}small{display:block;line-height:1.8;color:#b6c5c0}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}.actions a{border:1px solid #779b8f;border-radius:6px;padding:8px 12px;text-decoration:none}a:focus-visible{outline:2px solid #b3efd9;outline-offset:4px}
</style></head>
<body><header><a href="../">VRMCへ戻る</a><h1>サンプルVRM</h1><p>VRMファイルをダウンロードできます。<br>ダウンロードしたファイルは従来版やPartyにも読み込めます。各モデルの利用条件をご確認ください。</p></header>
<main id="models" aria-label="サンプル一覧"></main><noscript>一覧を表示するにはJavaScriptを有効にしてください。</noscript>
<script type="module">
import {sampleModels} from './catalog.js';
for(const model of sampleModels){
 const card=document.createElement('article');
 if(model.thumbnail){const image=new Image();image.src=model.thumbnail;image.alt=model.name+'のプレビュー';image.loading='lazy';card.append(image);}
 const title=document.createElement('h2');title.textContent=model.name;card.append(title);
 if(model.author){const author=document.createElement('p');author.textContent=model.author;card.append(author);}
 if(model.terms){const terms=document.createElement('small');terms.textContent=model.terms;card.append(terms);}
 if(model.license){const license=document.createElement('a');license.href=model.license;license.textContent='ライセンス';card.append(license);}
 const actions=document.createElement('div');actions.className='actions';
 const download=document.createElement('a');download.href=model.url;download.download=model.file.split('/').at(-1);download.textContent='ダウンロード';
 actions.append(download);card.append(actions);document.getElementById('models').append(card);
}
</script></body></html>
